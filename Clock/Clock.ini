; ============================================================================
; SPACEGLASS — WIDGET 1: CLOCK AND WEATHER (Clock/Clock.ini)
; Visual layout matches reference screenshot:
;   Left:  19:30 (34pt Semibold) / Sun, Nov 1 (10pt Muted)
;   Right: Weather Icon + 28° (16pt Medium) / Nagpur (10pt Muted)
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowW=320
WindowH=106
DefaultWindowX=#DefaultX#
DefaultWindowY=#ClockY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="SpaceGlass Settings..."
ContextAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab general]
ContextTitle2="Toggle 12h / 24h Clock"
ContextAction2=[!CommandMeasure MeasureClockWeatherScript "ToggleClockFormat()"]
ContextTitle3="Configure City & Weather..."
ContextAction3=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab general]

[Metadata]
Name=SpaceGlass — Clock & Weather
Author=SpaceGlass Engineering
Information=Real-time system clock (12/24h) and live weather widget with DWM Acrylic glassmorphism.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; --- Windows 11 DWM Acrylic / Blur Composition ---
; [MeasureFrostedGlass]  Disabled (plugin not installed)
; Measure=Plugin
; Plugin=FrostedGlass
; Type=#BlurType#
; Border=#BlurBorder#
; Corner=Round
; Backdrop=Dark

; --- System Time & Date Measures ---
[MeasureTime24]
Measure=Time
Format=%H:%M

[MeasureTime12]
Measure=Time
Format=%I:%M %p

[MeasureSeconds]
Measure=Time
Format=%S

[MeasureDateFormatted]
Measure=Time
Format=%a, %b %#d

; --- Lua Controller for Clock Format & Weather JSON Parsing ---
[MeasureClockWeatherScript]
Measure=Script
ScriptFile=#@#Scripts\clock_weather.lua
UpdateDivider=1

; --- Local Backend Weather Endpoint Polling (Every 15 minutes) ---
[MeasureWeatherWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/weather?city=#CityName#&lat=#Latitude#&lon=#Longitude#&unit=#TemperatureUnit#
RegExp=(?siU)^(.*)$
UpdateRate=#WeatherRefreshSeconds#
FinishAction=[!CommandMeasure MeasureClockWeatherScript "OnWeatherResponse()"]
OnConnectErrorAction=[!CommandMeasure MeasureClockWeatherScript "OnWeatherError()"]

; ============================================================================
; GLASSMORPHISM SURFACE & SPECULAR BORDERS
; ============================================================================
[MeterGlassPanel]
Meter=Shape
X=0
Y=0
Shape=Rectangle 1,1,318,104,#GlassCornerRadius# | Fill Color #GlassSurface# | StrokeWidth 0
Shape2=Rectangle 1,1,318,104,#GlassCornerRadius# | Fill LinearGradient GradFill | StrokeWidth #GlassBorderWidth# | Stroke LinearGradient GradBorder
Shape3=Rectangle 2,2,316,102,(#GlassCornerRadius#-1) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #GlassBorderInner#
GradFill=135 | #GlassGradientTop# ; 0.0 | #GlassAmbientWarm# ; 0.45 | #GlassGradientBottom# ; 1.0
GradBorder=145 | #GlassHighlightTop# ; 0.0 | #GlassBorderOuter# ; 0.5 | 255,255,255,25 ; 1.0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab general]
ToolTipText="Click to open SpaceGlass Clock & Weather Settings"

[MeterGlassReflection]
Meter=Image
ImageName=#@#Images\glass_reflection.png
X=1
Y=1
W=318
H=104
ImageAlpha=180

; ============================================================================
; LEFT COLUMN: TIME & DAY/DATE
; ============================================================================
[MeterTime]
Meter=String
MeasureName=MeasureTime24
X=24
Y=14
FontFace=#FontPrimary#
FontSize=#FontSizeClock#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
Text="<"
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab general]

[MeterDate]
Meter=String
MeasureName=MeasureDateFormatted
X=26
Y=68
FontFace=#FontPrimary#
FontSize=#FontSizeBody#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
AntiAlias=1
Text="<"

; ============================================================================
; RIGHT COLUMN: WEATHER ICON, TEMPERATURE & CITY
; Gracefully hidden when WeatherEnabled=0 or when no weather data is available
; ============================================================================
[MeterWeatherIcon]
Meter=Image
ImageName=#@#Icons\weather_partly_cloudy.png
X=226
Y=25
W=28
H=28
AntiAlias=1
DynamicVariables=1
Hidden=0

[MeterWeatherTemp]
Meter=String
X=296
Y=24
FontFace=#FontPrimary#
FontSize=#FontSizeWeatherTemp#
FontColor=#TextPrimary#
FontWeight=#FontWeightMedium#
StringAlign=Right
AntiAlias=1
Text="--"
DynamicVariables=1
Hidden=0

[MeterWeatherCity]
Meter=String
X=296
Y=68
FontFace=#FontPrimary#
FontSize=#FontSizeBody#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Right
AntiAlias=1
Text="#CityName#"
DynamicVariables=1
Hidden=0
