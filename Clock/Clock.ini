; ============================================================================
; SPACEGLASS — WIDGET 1: CLOCK & WEATHER (Clock/Clock.ini)
; Unified Visual Styling & Proportional Layout
; Left:  Time (32pt Semibold) / Day & Date (10pt Muted)
; Right: Weather Icon + Temp (16pt Semibold) / City (10pt Muted)
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=#DefaultX#
DefaultWindowY=#ClockY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="SpaceGlass Settings..."
ContextAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab general]
ContextTitle2="Toggle 12h / 24h Clock"
ContextAction2=[!CommandMeasure MeasureClockWeatherScript "ToggleClockFormat()"]
ContextTitle3="Configure City & Weather..."
ContextAction3=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab general]

[Metadata]
Name=SpaceGlass — Clock & Weather
Author=SpaceGlass Engineering
Information=System clock (12/24h) and weather widget with native vector glassmorphism.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; --- System Time & Date Measures ---
[MeasureTime24]
Measure=Time
Format=%H:%M

[MeasureTime12]
Measure=Time
Format=%I:%M %p

[MeasureSeconds]
Measure=Time
Format=%S

[MeasureDateFormatted]
Measure=Time
Format=%A, %b %#d

; --- Lua Controller for Clock Format & Weather JSON Parsing ---
[MeasureClockWeatherScript]
Measure=Script
ScriptFile=#@#Scripts\clock_weather.lua
UpdateDivider=1

; --- Local Backend Weather Endpoint Polling (Every 15 minutes) ---
[MeasureWeatherWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/weather?city=#CityName#&lat=#Latitude#&lon=#Longitude#&unit=#TemperatureUnit#
RegExp=(?siU)^(.*)$
UpdateRate=#WeatherRefreshSeconds#
FinishAction=[!CommandMeasure MeasureClockWeatherScript "OnWeatherResponse()"]
OnConnectErrorAction=[!CommandMeasure MeasureClockWeatherScript "OnWeatherError()"]

; ============================================================================
; UNIFIED GLASSMORPHIC BACKGROUND CONTAINER
; Clean native vector Shape meter with anti-aliasing and zero corner bleeding
; ============================================================================
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardWidth#,#ClockHeight#,#CardRadius# | Fill LinearGradient GradBg | StrokeWidth 1 | Stroke Color #CardBorder#
GradBg=135 | #BgGradTop# ; 0.0 | #BgGradBottom# ; 1.0
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab general]
ToolTipText="SpaceGlass Clock & Weather (Click for Settings)"

; ============================================================================
; LEFT COLUMN: TIME & DAY/DATE
; ============================================================================
[MeterTime]
Meter=String
MeasureName=MeasureTime24
X=24
Y=16
FontFace=#FontPrimary#
FontSize=#FontSizeClock#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
DynamicVariables=1
Text="%1"
LeftMouseUpAction=[!CommandMeasure MeasureClockWeatherScript "ToggleClockFormat()"]
ToolTipText="Click to toggle 12h / 24h format"

[MeterDate]
Meter=String
MeasureName=MeasureDateFormatted
X=25
Y=62
FontFace=#FontPrimary#
FontSize=#FontSizeBody#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
AntiAlias=1
DynamicVariables=1
Text="%1"

; ============================================================================
; RIGHT COLUMN: WEATHER ICON, TEMPERATURE & CITY
; ============================================================================
[MeterWeatherIcon]
Meter=Image
ImageName=#@#Icons\weather_partly_cloudy.png
X=224
Y=20
W=26
H=26
AntiAlias=1
DynamicVariables=1
Hidden=0

[MeterWeatherTemp]
Meter=String
X=306
Y=22
FontFace=#FontPrimary#
FontSize=#FontSizeWeatherTemp#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
StringAlign=Right
AntiAlias=1
Text="--"
DynamicVariables=1
Hidden=0

[MeterWeatherCity]
Meter=String
X=306
Y=62
FontFace=#FontPrimary#
FontSize=#FontSizeBody#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Right
AntiAlias=1
Text="#CityName#"
DynamicVariables=1
Hidden=0
