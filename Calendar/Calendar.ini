; ============================================================================
; SPACEGLASS — WIDGET 2: INTERACTIVE MONTHLY GOOGLE CALENDAR (Calendar/Calendar.ini)
; Visual layout matches reference screenshot:
;   Header: "November 2026" on left, "<" and ">" navigation chevrons on right
;   Week row: Sun Mon Tue Wed Thu Fri Sat (or Mon..Sun when WeekStartMonday=1)
;   Date grid: 42 cells (6 rows x 7 columns), orange rounded pill (#FF7A18) on
;              today's date, colored event indicator dots (#A66CDB / #58A6FF)
;              under dates with Google Calendar events, and click-a-date preview.
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowW=320
WindowH=218
DefaultWindowX=#DefaultX#
DefaultWindowY=#CalendarY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Jump to Current Month"
ContextAction=[!CommandMeasure MeasureCalendarScript "JumpToToday()"]
ContextTitle2="Toggle Sunday / Monday Week Start"
ContextAction2=[!CommandMeasure MeasureCalendarScript "ToggleWeekStart()"]
ContextTitle3="Open Google Calendar in Browser"
ContextAction3=["#GoogleCalendarWebUrl#"]
ContextTitle4="SpaceGlass Settings..."
ContextAction4=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Monthly Calendar
Author=SpaceGlass Engineering
Information=Interactive monthly calendar with real Google Calendar event indicators, leap-year math, and date inspector.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; [MeasureFrostedGlass]  Disabled (plugin not installed)
; Measure=Plugin
; Plugin=FrostedGlass
; Type=#BlurType#
; Border=#BlurBorder#
; Corner=Round
; Backdrop=Dark

; --- Backend Month Events Polling ---
[MeasureMonthWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/calendar/month?year=2026&month=11
RegExp=(?siU)^(.*)$
UpdateRate=#CalendarRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureCalendarScript "OnMonthDataReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureCalendarScript "OnBackendOffline()"]

; --- Lua Calendar Engine ---
[MeasureCalendarScript]
Measure=Script
ScriptFile=#@#Scripts\calendar.lua
UpdateDivider=60

; ============================================================================
; GLASSMORPHISM PANEL & HEADER
; ============================================================================
[MeterGlassPanel]
Meter=Shape
X=0
Y=0
Shape=Rectangle 1,1,318,216,#GlassCornerRadius# | Fill Color #GlassSurface# | StrokeWidth 0
Shape2=Rectangle 1,1,318,216,#GlassCornerRadius# | Fill LinearGradient GradFill | StrokeWidth #GlassBorderWidth# | Stroke LinearGradient GradBorder
Shape3=Rectangle 2,2,316,214,(#GlassCornerRadius#-1) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #GlassBorderInner#
GradFill=135 | #GlassGradientTop# ; 0.0 | #GlassAmbientWarm# ; 0.45 | #GlassGradientBottom# ; 1.0
GradBorder=145 | #GlassHighlightTop# ; 0.0 | #GlassBorderOuter# ; 0.5 | 255,255,255,25 ; 1.0

[MeterGlassReflection]
Meter=Image
ImageName=#@#Images\glass_reflection.png
X=1
Y=1
W=318
H=216
ImageAlpha=170

[MeterMonthTitle]
Meter=String
X=22
Y=16
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
Text="November 2026"
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "JumpToToday()"]
ToolTipText="Click to return to current month"

[MeterPrevMonthBtn]
Meter=String
X=268
Y=14
W=20
H=20
FontFace=#FontPrimary#
FontSize=12
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
AntiAlias=1
Text="<"
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "NavigateMonth(-1)"]
MouseOverAction=[!SetOption MeterPrevMonthBtn FontColor "#TextPrimary#"][!UpdateMeter MeterPrevMonthBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterPrevMonthBtn FontColor "#TextMuted#"][!UpdateMeter MeterPrevMonthBtn][!Redraw]
ToolTipText="Previous month"

[MeterNextMonthBtn]
Meter=String
X=294
Y=14
W=20
H=20
FontFace=#FontPrimary#
FontSize=12
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
AntiAlias=1
Text=">"
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "NavigateMonth(1)"]
MouseOverAction=[!SetOption MeterNextMonthBtn FontColor "#TextPrimary#"][!UpdateMeter MeterNextMonthBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterNextMonthBtn FontColor "#TextMuted#"][!UpdateMeter MeterNextMonthBtn][!Redraw]
ToolTipText="Next month"

; ============================================================================
; DAY-OF-WEEK HEADERS (7 Columns: X = 32, 71, 110, 149, 188, 227, 266 + Center)
; ============================================================================
[StyleDayHeader]
FontFace=#FontPrimary#
FontSize=#FontSizeCalendarDayHeader#
FontColor=#TextMuted#
FontWeight=#FontWeightMedium#
StringAlign=Center
AntiAlias=1
Y=44

[MeterDOW1]
Meter=String
MeterStyle=StyleDayHeader
X=35
Text="Sun"

[MeterDOW2]
Meter=String
MeterStyle=StyleDayHeader
X=76
Text="Mon"

[MeterDOW3]
Meter=String
MeterStyle=StyleDayHeader
X=117
Text="Tue"

[MeterDOW4]
Meter=String
MeterStyle=StyleDayHeader
X=158
Text="Wed"

[MeterDOW5]
Meter=String
MeterStyle=StyleDayHeader
X=199
Text="Thu"

[MeterDOW6]
Meter=String
MeterStyle=StyleDayHeader
X=240
Text="Fri"

[MeterDOW7]
Meter=String
MeterStyle=StyleDayHeader
X=281
Text="Sat"

; ============================================================================
; TODAY ORANGE PILL HIGHLIGHT & SELECTED DATE OUTLINE
; ============================================================================
[MeterTodayPill]
Meter=Shape
X=0
Y=0
Shape=Rectangle 20,63,30,19,9.5 | Fill Color #AccentOrange#,255 | StrokeWidth 0
DynamicVariables=1
Hidden=0

[MeterSelectedDateRing]
Meter=Shape
X=0
Y=0
Shape=Rectangle 20,63,30,19,9.5 | Fill Color 255,255,255,22 | StrokeWidth 1.2 | Stroke Color #CosmicBlue#,220
DynamicVariables=1
Hidden=1

; ============================================================================
; 42 DYNAMIC CALENDAR CELLS & EVENT INDICATOR DOTS
; Generated/controlled by @Resources/Scripts/calendar.lua
; ============================================================================
@IncludeCells=#@#Data\CalendarCells.inc

; ============================================================================
; SELECTED DATE FOOTER / SYNC STATUS BAR
; ============================================================================
[MeterSelectedDateInfo]
Meter=String
X=22
Y=194
W=276
H=18
ClipString=1
FontFace=#FontPrimary#
FontSize=8
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
AntiAlias=1
Text=""
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "OpenSelectedDateInBrowser()"]
