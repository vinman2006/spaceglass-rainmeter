; ============================================================================
; SPACEGLASS — WIDGET 2: MONTHLY GOOGLE CALENDAR (Calendar/Calendar.ini)
; Unified Visual Styling, Mathematically Centered Grid & Vector Chevrons
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=#DefaultX#
DefaultWindowY=#CalendarY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Jump to Current Month"
ContextAction=[!CommandMeasure MeasureCalendarScript "JumpToToday()"]
ContextTitle2="Toggle Sunday / Monday Week Start"
ContextAction2=[!CommandMeasure MeasureCalendarScript "ToggleWeekStart()"]
ContextTitle3="Open Google Calendar in Browser"
ContextAction3=["#GoogleCalendarWebUrl#"]
ContextTitle4="SpaceGlass Settings..."
ContextAction4=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Monthly Calendar
Author=SpaceGlass Engineering
Information=Interactive monthly calendar with real Google Calendar indicators and vector chevrons.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; --- Backend Month Events Polling ---
[MeasureMonthWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/calendar/month?year=2026&month=11
RegExp=(?siU)^(.*)$
UpdateRate=#CalendarRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureCalendarScript "OnMonthDataReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureCalendarScript "OnBackendOffline()"]

; --- Lua Calendar Engine ---
[MeasureCalendarScript]
Measure=Script
ScriptFile=#@#Scripts\calendar.lua
UpdateDivider=60

; ============================================================================
; UNIFIED GLASSMORPHIC BACKGROUND CONTAINER
; ============================================================================
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardWidth#,#CalendarHeight#,#CardRadius# | Fill LinearGradient GradBg | StrokeWidth 1 | Stroke Color #CardBorder#
GradBg=135 | #BgGradTop# ; 0.0 | #BgGradBottom# ; 1.0
AntiAlias=1
DynamicVariables=1

; ============================================================================
; HEADER: MONTH / YEAR TITLE & VECTOR CHEVRONS
; ============================================================================
[MeterMonthTitle]
Meter=String
X=24
Y=18
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
Text="November 2026"
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "JumpToToday()"]
ToolTipText="Click to return to current month"

[MeterPrevBtn]
Meter=Shape
X=254
Y=12
Shape=Ellipse 14,14,14,14 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path ChevronLeft | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
ChevronLeft=16,9 | LineTo 11,14 | LineTo 16,19
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "NavigateMonth(-1)"]
MouseOverAction=[!SetOption MeterPrevBtn Shape "Ellipse 14,14,14,14 | Fill Color 255,255,255,28 | StrokeWidth 0"][!SetOption MeterPrevBtn Shape2 "Path ChevronLeft | StrokeWidth 1.8 | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterPrevBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterPrevBtn Shape "Ellipse 14,14,14,14 | Fill Color 0,0,0,1 | StrokeWidth 0"][!SetOption MeterPrevBtn Shape2 "Path ChevronLeft | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterPrevBtn][!Redraw]
ToolTipText="Previous month"

[MeterNextBtn]
Meter=Shape
X=286
Y=12
Shape=Ellipse 14,14,14,14 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path ChevronRight | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
ChevronRight=12,9 | LineTo 17,14 | LineTo 12,19
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "NavigateMonth(1)"]
MouseOverAction=[!SetOption MeterNextBtn Shape "Ellipse 14,14,14,14 | Fill Color 255,255,255,28 | StrokeWidth 0"][!SetOption MeterNextBtn Shape2 "Path ChevronRight | StrokeWidth 1.8 | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterNextBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterNextBtn Shape "Ellipse 14,14,14,14 | Fill Color 0,0,0,1 | StrokeWidth 0"][!SetOption MeterNextBtn Shape2 "Path ChevronRight | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterNextBtn][!Redraw]
ToolTipText="Next month"

; ============================================================================
; DAY-OF-WEEK HEADERS (7 Columns mathematically centered at 33, 77, 121, 165, 209, 253, 297)
; ============================================================================
[StyleDayHeader]
FontFace=#FontPrimary#
FontSize=#FontSizeCalendarDayHeader#
FontColor=#TextMuted#
FontWeight=#FontWeightMedium#
StringAlign=Center
AntiAlias=1
Y=46

[MeterDOW1]
Meter=String
MeterStyle=StyleDayHeader
X=33
Text="Sun"

[MeterDOW2]
Meter=String
MeterStyle=StyleDayHeader
X=77
Text="Mon"

[MeterDOW3]
Meter=String
MeterStyle=StyleDayHeader
X=121
Text="Tue"

[MeterDOW4]
Meter=String
MeterStyle=StyleDayHeader
X=165
Text="Wed"

[MeterDOW5]
Meter=String
MeterStyle=StyleDayHeader
X=209
Text="Thu"

[MeterDOW6]
Meter=String
MeterStyle=StyleDayHeader
X=253
Text="Fri"

[MeterDOW7]
Meter=String
MeterStyle=StyleDayHeader
X=297
Text="Sat"

; ============================================================================
; TODAY ORANGE PILL HIGHLIGHT & SELECTED DATE OUTLINE
; Mathematically centered 32x24 capsule (radius 12)
; ============================================================================
[MeterTodayPill]
Meter=Shape
X=0
Y=0
Shape=Rectangle 17,63,32,24,12 | Fill Color #AccentOrange#,255 | StrokeWidth 0
DynamicVariables=1
Hidden=0

[MeterSelectedDateRing]
Meter=Shape
X=0
Y=0
Shape=Rectangle 17,63,32,24,12 | Fill Color 255,255,255,22 | StrokeWidth 1 | Stroke Color #CosmicBlue#,220
DynamicVariables=1
Hidden=1

; ============================================================================
; 42 DYNAMIC CALENDAR CELLS & EVENT INDICATOR DOTS
; ============================================================================
@IncludeCells=#@#Data\CalendarCells.inc

; ============================================================================
; SELECTED DATE FOOTER / SYNC STATUS BAR
; ============================================================================
[MeterSelectedDateInfo]
Meter=String
X=24
Y=198
W=282
H=16
ClipString=1
FontFace=#FontPrimary#
FontSize=8
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
AntiAlias=1
Text=""
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "OpenSelectedDateInBrowser()"]
