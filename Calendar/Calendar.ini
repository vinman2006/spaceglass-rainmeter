; ============================================================================
; SPACEGLASS — WIDGET 2: MONTHLY GOOGLE CALENDAR (Calendar/Calendar.ini)
; High-DPI / 4K Resolution Scalable Architecture
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=#DefaultX#
DefaultWindowY=#CalendarY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Jump to Current Month"
ContextAction=[!CommandMeasure MeasureCalendarScript "JumpToToday()"]
ContextTitle2="Toggle Sunday / Monday Week Start"
ContextAction2=[!CommandMeasure MeasureCalendarScript "ToggleWeekStart()"]
ContextTitle3="Open Google Calendar in Browser"
ContextAction3=["#GoogleCalendarWebUrl#"]
ContextTitle4="SpaceGlass Settings..."
ContextAction4=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Monthly Calendar
Author=SpaceGlass Engineering
Information=High-DPI scalable interactive monthly calendar with vector chevrons and Google Calendar indicators.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; --- Backend Month Events Polling ---
[MeasureMonthWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/calendar/month?year=2026&month=11
RegExp=(?siU)^(.*)$
UpdateRate=#CalendarRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureCalendarScript "OnMonthDataReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureCalendarScript "OnBackendOffline()"]

; --- Lua Calendar Engine ---
[MeasureCalendarScript]
Measure=Script
ScriptFile=#@#Scripts\calendar.lua
UpdateDivider=60

; ============================================================================
; UNIFIED GLASSMORPHIC BACKGROUND CONTAINER (High-DPI Dual Specular Border)
; ============================================================================
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardWidth#,#CalendarHeight#,#CardRadius# | Fill LinearGradient GradBg | StrokeWidth (1 * #Scale#) | Stroke Color #GlassBorderOuter#
Shape2=Rectangle (1 * #Scale#),(1 * #Scale#),(#CardWidth# - (2 * #Scale#)),(#CalendarHeight# - (2 * #Scale#)),(#CardRadius# - (1 * #Scale#)) | Fill Color 0,0,0,0 | StrokeWidth (1 * #Scale#) | Stroke Color #GlassBorderInner#
GradBg=135 | #BgGradTop# ; 0.0 | #BgGradBottom# ; 1.0
AntiAlias=1
DynamicVariables=1

; ============================================================================
; HEADER: MONTH / YEAR TITLE & SCALABLE VECTOR CHEVRONS
; ============================================================================
[MeterMonthTitle]
Meter=String
X=(24 * #Scale#)
Y=(18 * #Scale#)
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
DynamicVariables=1
Text="November 2026"
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "JumpToToday()"]
ToolTipText="Click to return to current month"

[MeterPrevBtn]
Meter=Shape
X=(254 * #Scale#)
Y=(12 * #Scale#)
Shape=Ellipse (14 * #Scale#),(14 * #Scale#),(14 * #Scale#),(14 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path ChevronLeft | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
ChevronLeft=(16 * #Scale#),(9 * #Scale#) | LineTo (11 * #Scale#),(14 * #Scale#) | LineTo (16 * #Scale#),(19 * #Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "NavigateMonth(-1)"]
MouseOverAction=[!SetOption MeterPrevBtn Shape "Ellipse (14 * #Scale#),(14 * #Scale#),(14 * #Scale#),(14 * #Scale#) | Fill Color 255,255,255,28 | StrokeWidth 0"][!SetOption MeterPrevBtn Shape2 "Path ChevronLeft | StrokeWidth (1.8 * #Scale#) | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterPrevBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterPrevBtn Shape "Ellipse (14 * #Scale#),(14 * #Scale#),(14 * #Scale#),(14 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0"][!SetOption MeterPrevBtn Shape2 "Path ChevronLeft | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterPrevBtn][!Redraw]
ToolTipText="Previous month"

[MeterNextBtn]
Meter=Shape
X=(286 * #Scale#)
Y=(12 * #Scale#)
Shape=Ellipse (14 * #Scale#),(14 * #Scale#),(14 * #Scale#),(14 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path ChevronRight | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
ChevronRight=(12 * #Scale#),(9 * #Scale#) | LineTo (17 * #Scale#),(14 * #Scale#) | LineTo (12 * #Scale#),(19 * #Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "NavigateMonth(1)"]
MouseOverAction=[!SetOption MeterNextBtn Shape "Ellipse (14 * #Scale#),(14 * #Scale#),(14 * #Scale#),(14 * #Scale#) | Fill Color 255,255,255,28 | StrokeWidth 0"][!SetOption MeterNextBtn Shape2 "Path ChevronRight | StrokeWidth (1.8 * #Scale#) | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterNextBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterNextBtn Shape "Ellipse (14 * #Scale#),(14 * #Scale#),(14 * #Scale#),(14 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0"][!SetOption MeterNextBtn Shape2 "Path ChevronRight | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round"][!UpdateMeter MeterNextBtn][!Redraw]
ToolTipText="Next month"

; ============================================================================
; DAY-OF-WEEK HEADERS (7 Scalable Columns)
; ============================================================================
[StyleDayHeader]
FontFace=#FontPrimary#
FontSize=#FontSizeCalendarDayHeader#
FontColor=#TextMuted#
FontWeight=#FontWeightMedium#
StringAlign=Center
AntiAlias=1
DynamicVariables=1
Y=(46 * #Scale#)

[MeterDOW1]
Meter=String
MeterStyle=StyleDayHeader
X=(33 * #Scale#)
Text="Sun"

[MeterDOW2]
Meter=String
MeterStyle=StyleDayHeader
X=(77 * #Scale#)
Text="Mon"

[MeterDOW3]
Meter=String
MeterStyle=StyleDayHeader
X=(121 * #Scale#)
Text="Tue"

[MeterDOW4]
Meter=String
MeterStyle=StyleDayHeader
X=(165 * #Scale#)
Text="Wed"

[MeterDOW5]
Meter=String
MeterStyle=StyleDayHeader
X=(209 * #Scale#)
Text="Thu"

[MeterDOW6]
Meter=String
MeterStyle=StyleDayHeader
X=(253 * #Scale#)
Text="Fri"

[MeterDOW7]
Meter=String
MeterStyle=StyleDayHeader
X=(297 * #Scale#)
Text="Sat"

; ============================================================================
; TODAY ORANGE PILL HIGHLIGHT & SELECTED DATE OUTLINE
; ============================================================================
[MeterTodayPill]
Meter=Shape
X=0
Y=0
Shape=Rectangle (17 * #Scale#),(63 * #Scale#),(32 * #Scale#),(24 * #Scale#),(12 * #Scale#) | Fill Color #AccentOrange#,255 | StrokeWidth 0
AntiAlias=1
DynamicVariables=1
Hidden=0

[MeterSelectedDateRing]
Meter=Shape
X=0
Y=0
Shape=Rectangle (17 * #Scale#),(63 * #Scale#),(32 * #Scale#),(24 * #Scale#),(12 * #Scale#) | Fill Color 255,255,255,22 | StrokeWidth (1 * #Scale#) | Stroke Color #CosmicBlue#,220
AntiAlias=1
DynamicVariables=1
Hidden=1

; ============================================================================
; 42 DYNAMIC CALENDAR CELLS & EVENT INDICATOR DOTS
; ============================================================================
@IncludeCells=#@#Data\CalendarCells.inc

; ============================================================================
; SELECTED DATE FOOTER / SYNC STATUS BAR
; ============================================================================
[MeterSelectedDateInfo]
Meter=String
X=(24 * #Scale#)
Y=(198 * #Scale#)
W=(282 * #Scale#)
H=(16 * #Scale#)
ClipString=1
FontFace=#FontPrimary#
FontSize=(8 * #Scale#)
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
AntiAlias=1
DynamicVariables=1
Text=""
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "OpenSelectedDateInBrowser()"]
