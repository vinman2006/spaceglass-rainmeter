; ============================================================================
; SPACEGLASS — WIDGET 3: UPCOMING EVENTS (Events/Events.ini)
; High-DPI / 4K Resolution Scalable Architecture
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=#DefaultX#
DefaultWindowY=#EventsY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Refresh Upcoming Events"
ContextAction=[!CommandMeasure MeasureEventsWebParser "Update"]
ContextTitle2="Create New Event in Google Calendar"
ContextAction2=["#GoogleCalendarNewEventUrl#"]
ContextTitle3="SpaceGlass Settings..."
ContextAction3=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Upcoming Events
Author=SpaceGlass Engineering
Information=High-DPI scalable Google Calendar events widget with status pill badge and compact unlinked card.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

[MeasureEventsWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/calendar/events?limit=4
RegExp=(?siU)^(.*)$
UpdateRate=#EventsRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureEventsScript "OnEventsReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureEventsScript "OnEventsError()"]

[MeasureEventsScript]
Measure=Script
ScriptFile=#@#Scripts\events.lua
UpdateDivider=30

; ============================================================================
; UNIFIED GLASSMORPHIC BACKGROUND CONTAINER (High-DPI Dual Specular Border)
; ============================================================================
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardWidth#,#EventsHeight#,#CardRadius# | Fill LinearGradient GradBg | StrokeWidth (1 * #Scale#) | Stroke Color #GlassBorderOuter#
Shape2=Rectangle (1 * #Scale#),(1 * #Scale#),(#CardWidth# - (2 * #Scale#)),(#EventsHeight# - (2 * #Scale#)),(#CardRadius# - (1 * #Scale#)) | Fill Color 0,0,0,0 | StrokeWidth (1 * #Scale#) | Stroke Color #GlassBorderInner#
GradBg=135 | #BgGradTop# ; 0.0 | #BgGradBottom# ; 1.0
AntiAlias=1
DynamicVariables=1

; ============================================================================
; HEADER ROW: ICON (24x24), TITLE, STATUS PILL & SCALABLE PLUS BUTTON
; Baseline aligned along (26 * #Scale#)
; ============================================================================
[MeterCalendarBadge]
Meter=Image
ImageName=#@#Icons\calendar_badge.png
X=(20 * #Scale#)
Y=(16 * #Scale#)
W=(24 * #Scale#)
H=(24 * #Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["#GoogleCalendarWebUrl#"]
ToolTipText="Open Google Calendar"

[MeterHeaderTitle]
Meter=String
X=(52 * #Scale#)
Y=(18 * #Scale#)
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
DynamicVariables=1
Text="Upcoming Events"

; Status Pill: Muted rounded badge with rgba(255,255,255,0.07) background
[MeterSyncBadgeBg]
Meter=Shape
X=(206 * #Scale#)
Y=(18 * #Scale#)
Shape=Rectangle 0,0,(76 * #Scale#),(20 * #Scale#),(10 * #Scale#) | Fill Color 255,255,255,18 | StrokeWidth (1 * #Scale#) | Stroke Color 255,255,255,25
AntiAlias=1
DynamicVariables=1
Hidden=0

[MeterSyncBadge]
Meter=String
X=(244 * #Scale#)
Y=(21 * #Scale#)
FontFace=#FontPrimary#
FontSize=(9 * #Scale#)
FontColor=#TextMuted#
FontWeight=500
StringAlign=Center
AntiAlias=1
DynamicVariables=1
Text="Not linked"
Hidden=0

; Geometric Plus Icon Button (Scalable)
[MeterAddEventBtn]
Meter=Shape
X=(292 * #Scale#)
Y=(16 * #Scale#)
Shape=Ellipse (12 * #Scale#),(12 * #Scale#),(12 * #Scale#),(12 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line (7 * #Scale#),(12 * #Scale#),(17 * #Scale#),(12 * #Scale#) | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line (12 * #Scale#),(7 * #Scale#),(12 * #Scale#),(17 * #Scale#) | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["#GoogleCalendarNewEventUrl#"]
MouseOverAction=[!SetOption MeterAddEventBtn Shape "Ellipse (12 * #Scale#),(12 * #Scale#),(12 * #Scale#),(12 * #Scale#) | Fill Color 255,255,255,28 | StrokeWidth 0"][!SetOption MeterAddEventBtn Shape2 "Line (7 * #Scale#),(12 * #Scale#),(17 * #Scale#),(12 * #Scale#) | StrokeWidth (1.8 * #Scale#) | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round"][!SetOption MeterAddEventBtn Shape3 "Line (12 * #Scale#),(7 * #Scale#),(12 * #Scale#),(17 * #Scale#) | StrokeWidth (1.8 * #Scale#) | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round"][!UpdateMeter MeterAddEventBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterAddEventBtn Shape "Ellipse (12 * #Scale#),(12 * #Scale#),(12 * #Scale#),(12 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0"][!SetOption MeterAddEventBtn Shape2 "Line (7 * #Scale#),(12 * #Scale#),(17 * #Scale#),(12 * #Scale#) | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round"][!SetOption MeterAddEventBtn Shape3 "Line (12 * #Scale#),(7 * #Scale#),(12 * #Scale#),(17 * #Scale#) | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round"][!UpdateMeter MeterAddEventBtn][!Redraw]
ToolTipText="Create new event in Google Calendar"

; ============================================================================
; UNLINKED / EMPTY STATE: INTERACTIVE CLICKABLE PILL BUTTON
; ============================================================================
[MeterEmptyState]
Meter=String
X=(165 * #Scale#)
Y=(50 * #Scale#)
W=(280 * #Scale#)
FontFace=#FontPrimary#
FontSize=#FontSizeSub#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
ClipString=2
AntiAlias=1
DynamicVariables=1
Text="Connect Google Account in Settings to view events."
Hidden=0

[MeterConnectBtnBg]
Meter=Shape
X=(65 * #Scale#)
Y=(78 * #Scale#)
Shape=Rectangle 0,0,(200 * #Scale#),(32 * #Scale#),(16 * #Scale#) | Fill Color #AccentOrange#,210 | StrokeWidth (1 * #Scale#) | Stroke Color 255,255,255,40
AntiAlias=1
DynamicVariables=1
Hidden=0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]
MouseOverAction=[!SetOption MeterConnectBtnBg Shape "Rectangle 0,0,(200 * #Scale#),(32 * #Scale#),(16 * #Scale#) | Fill Color #AccentOrange#,255 | StrokeWidth (1 * #Scale#) | Stroke Color 255,255,255,80"][!UpdateMeter MeterConnectBtnBg][!Redraw]
MouseLeaveAction=[!SetOption MeterConnectBtnBg Shape "Rectangle 0,0,(200 * #Scale#),(32 * #Scale#),(16 * #Scale#) | Fill Color #AccentOrange#,210 | StrokeWidth (1 * #Scale#) | Stroke Color 255,255,255,40"][!UpdateMeter MeterConnectBtnBg][!Redraw]
ToolTipText="Open Settings to link Google Account"

[MeterConnectBtnText]
Meter=String
X=(165 * #Scale#)
Y=(86 * #Scale#)
FontFace=#FontPrimary#
FontSize=(10 * #Scale#)
FontColor=#TextPrimary#
FontWeight=600
StringAlign=Center
AntiAlias=1
DynamicVariables=1
Text="Connect Google Account"
Hidden=0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

