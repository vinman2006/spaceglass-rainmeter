; ============================================================================
; SPACEGLASS — WIDGET 3: UPCOMING EVENTS (Events/Events.ini)
; Visual layout matches reference screenshot:
;   Header: Google Calendar '31' icon + "Upcoming Events" + "+" button
;   Items:  Vertical colored rounded pill bar (#A66CDB, #58A6FF, #FF7A18),
;           Bold white title ("SAC Meeting"),
;           Muted date & time subtitle ("Tomorrow · 10:30 – 11:30 AM").
;   Empty state: "No upcoming events. Enjoy your free time!"
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowW=320
WindowH=158
DefaultWindowX=#DefaultX#
DefaultWindowY=#EventsY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Refresh Upcoming Events"
ContextAction=[!CommandMeasure MeasureEventsWebParser "Update"]
ContextTitle2="Create New Event in Google Calendar"
ContextAction2=["#GoogleCalendarNewEventUrl#"]
ContextTitle3="SpaceGlass Settings..."
ContextAction3=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Upcoming Events
Author=SpaceGlass Engineering
Information=Displays upcoming Google Calendar events chronologically with calendar color bars and direct links.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; [MeasureFrostedGlass]  Disabled (plugin not installed)
; Measure=Plugin
; Plugin=FrostedGlass
; Type=#BlurType#
; Border=#BlurBorder#
; Corner=Round
; Backdrop=Dark

[MeasureEventsWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/calendar/events?limit=4
RegExp=(?siU)^(.*)$
UpdateRate=#EventsRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureEventsScript "OnEventsReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureEventsScript "OnEventsError()"]

[MeasureEventsScript]
Measure=Script
ScriptFile=#@#Scripts\events.lua
UpdateDivider=30

; ============================================================================
; GLASSMORPHISM PANEL & HEADER ROW
; ============================================================================
[MeterGlassPanel]
Meter=Shape
X=0
Y=0
Shape=Rectangle 1,1,318,156,#GlassCornerRadius# | Fill Color #GlassSurface# | StrokeWidth 0
Shape2=Rectangle 1,1,318,156,#GlassCornerRadius# | Fill LinearGradient GradFill | StrokeWidth #GlassBorderWidth# | Stroke LinearGradient GradBorder
Shape3=Rectangle 2,2,316,154,(#GlassCornerRadius#-1) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #GlassBorderInner#
GradFill=135 | #GlassGradientTop# ; 0.0 | #GlassAmbientWarm# ; 0.45 | #GlassGradientBottom# ; 1.0
GradBorder=145 | #GlassHighlightTop# ; 0.0 | #GlassBorderOuter# ; 0.5 | 255,255,255,25 ; 1.0

[MeterGlassReflection]
Meter=Image
ImageName=#@#Images\glass_reflection.png
X=1
Y=1
W=318
H=156
ImageAlpha=170

[MeterCalendarBadge]
Meter=Image
ImageName=#@#Icons\calendar_badge.png
X=20
Y=15
W=24
H=24
AntiAlias=1
LeftMouseUpAction=["#GoogleCalendarWebUrl#"]
ToolTipText="Open Google Calendar"

[MeterHeaderTitle]
Meter=String
X=52
Y=18
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
Text="Upcoming Events"

[MeterSyncBadge]
Meter=String
X=262
Y=20
FontFace=#FontPrimary#
FontSize=8
FontColor=#TextDimmed#
StringAlign=Right
AntiAlias=1
Text=""
DynamicVariables=1

[MeterAddEventBtn]
Meter=String
X=292
Y=13
W=24
H=24
FontFace=#FontPrimary#
FontSize=15
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
AntiAlias=1
Text="+"
LeftMouseUpAction=["#GoogleCalendarNewEventUrl#"]
MouseOverAction=[!SetOption MeterAddEventBtn FontColor "#TextPrimary#"][!UpdateMeter MeterAddEventBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterAddEventBtn FontColor "#TextMuted#"][!UpdateMeter MeterAddEventBtn][!Redraw]
ToolTipText="Create new event in Google Calendar"

; ============================================================================
; EMPTY / STATUS STATE MESSAGE
; ============================================================================
[MeterEmptyState]
Meter=String
X=160
Y=82
W=276
FontFace=#FontPrimary#
FontSize=#FontSizeBody#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
ClipString=2
AntiAlias=1
Text="No upcoming events. Enjoy your free time!"
Hidden=1

; ============================================================================
