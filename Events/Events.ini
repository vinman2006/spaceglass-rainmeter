; ============================================================================
; SPACEGLASS — WIDGET 3: UPCOMING EVENTS (Events/Events.ini)
; Unified Visual Styling, Baseline Alignment & Interactive Connect Button
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=#DefaultX#
DefaultWindowY=#EventsY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Refresh Upcoming Events"
ContextAction=[!CommandMeasure MeasureEventsWebParser "Update"]
ContextTitle2="Create New Event in Google Calendar"
ContextAction2=["#GoogleCalendarNewEventUrl#"]
ContextTitle3="SpaceGlass Settings..."
ContextAction3=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Upcoming Events
Author=SpaceGlass Engineering
Information=Displays upcoming Google Calendar events with status pill badge and compact unlinked card.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

[MeasureEventsWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/calendar/events?limit=4
RegExp=(?siU)^(.*)$
UpdateRate=#EventsRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureEventsScript "OnEventsReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureEventsScript "OnEventsError()"]

[MeasureEventsScript]
Measure=Script
ScriptFile=#@#Scripts\events.lua
UpdateDivider=30

; ============================================================================
; UNIFIED GLASSMORPHIC BACKGROUND CONTAINER
; ============================================================================
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardWidth#,#EventsHeight#,#CardRadius# | Fill LinearGradient GradBg | StrokeWidth 1 | Stroke Color #CardBorder#
GradBg=135 | #BgGradTop# ; 0.0 | #BgGradBottom# ; 1.0
AntiAlias=1
DynamicVariables=1

; ============================================================================
; HEADER ROW: ICON (24x24), TITLE, STATUS PILL & GEOMETRIC PLUS BUTTON
; Baseline aligned along Y=26
; ============================================================================
[MeterCalendarBadge]
Meter=Image
ImageName=#@#Icons\calendar_badge.png
X=20
Y=16
W=24
H=24
AntiAlias=1
LeftMouseUpAction=["#GoogleCalendarWebUrl#"]
ToolTipText="Open Google Calendar"

[MeterHeaderTitle]
Meter=String
X=52
Y=18
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
Text="Upcoming Events"

; Status Pill: Muted rounded badge with rgba(255,255,255,0.07) background
[MeterSyncBadgeBg]
Meter=Shape
X=206
Y=18
Shape=Rectangle 0,0,76,20,10 | Fill Color 255,255,255,18 | StrokeWidth 1 | Stroke Color 255,255,255,25
AntiAlias=1
DynamicVariables=1
Hidden=0

[MeterSyncBadge]
Meter=String
X=244
Y=21
FontFace=#FontPrimary#
FontSize=9
FontColor=#TextMuted#
FontWeight=500
StringAlign=Center
AntiAlias=1
Text="Not linked"
DynamicVariables=1
Hidden=0

; Geometric Plus Icon Button
[MeterAddEventBtn]
Meter=Shape
X=292
Y=16
Shape=Ellipse 12,12,12,12 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line 7,12,17,12 | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line 12,7,12,17 | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["#GoogleCalendarNewEventUrl#"]
MouseOverAction=[!SetOption MeterAddEventBtn Shape "Ellipse 12,12,12,12 | Fill Color 255,255,255,28 | StrokeWidth 0"][!SetOption MeterAddEventBtn Shape2 "Line 7,12,17,12 | StrokeWidth 1.8 | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round"][!SetOption MeterAddEventBtn Shape3 "Line 12,7,12,17 | StrokeWidth 1.8 | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round"][!UpdateMeter MeterAddEventBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterAddEventBtn Shape "Ellipse 12,12,12,12 | Fill Color 0,0,0,1 | StrokeWidth 0"][!SetOption MeterAddEventBtn Shape2 "Line 7,12,17,12 | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round"][!SetOption MeterAddEventBtn Shape3 "Line 12,7,12,17 | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round"][!UpdateMeter MeterAddEventBtn][!Redraw]
ToolTipText="Create new event in Google Calendar"

; ============================================================================
; UNLINKED / EMPTY STATE: INTERACTIVE CLICKABLE PILL BUTTON
; ============================================================================
[MeterEmptyState]
Meter=String
X=165
Y=50
W=280
FontFace=#FontPrimary#
FontSize=#FontSizeSub#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
ClipString=2
AntiAlias=1
Text="Connect Google Account in Settings to view events."
Hidden=0
DynamicVariables=1

[MeterConnectBtnBg]
Meter=Shape
X=65
Y=78
Shape=Rectangle 0,0,200,32,16 | Fill Color #AccentOrange#,210 | StrokeWidth 1 | Stroke Color 255,255,255,40
AntiAlias=1
DynamicVariables=1
Hidden=0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]
MouseOverAction=[!SetOption MeterConnectBtnBg Shape "Rectangle 0,0,200,32,16 | Fill Color #AccentOrange#,255 | StrokeWidth 1 | Stroke Color 255,255,255,80"][!UpdateMeter MeterConnectBtnBg][!Redraw]
MouseLeaveAction=[!SetOption MeterConnectBtnBg Shape "Rectangle 0,0,200,32,16 | Fill Color #AccentOrange#,210 | StrokeWidth 1 | Stroke Color 255,255,255,40"][!UpdateMeter MeterConnectBtnBg][!Redraw]
ToolTipText="Open Settings to link Google Account"

[MeterConnectBtnText]
Meter=String
X=165
Y=86
FontFace=#FontPrimary#
FontSize=10
FontColor=#TextPrimary#
FontWeight=600
StringAlign=Center
AntiAlias=1
Text="Connect Google Account"
DynamicVariables=1
Hidden=0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

