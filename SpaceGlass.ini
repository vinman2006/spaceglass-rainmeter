; ============================================================================
; SPACEGLASS — MASTER SUITE CONTROLLER & LAUNCHER (SpaceGlass.ini)
; Tagline: Your Universe. Your Schedule.
; Loads all 4 floating widgets on the right side of the Windows 11 desktop
; and starts the local Python FastAPI companion backend automatically.
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ActivateConfig "SpaceGlass\Clock" "Clock.ini"][!ActivateConfig "SpaceGlass\Calendar" "Calendar.ini"][!ActivateConfig "SpaceGlass\Events" "Events.ini"][!ActivateConfig "SpaceGlass\Tasks" "Tasks.ini"][!Move "#DefaultX#" "#ClockY#" "SpaceGlass\Clock"][!Move "#DefaultX#" "#CalendarY#" "SpaceGlass\Calendar"][!Move "#DefaultX#" "#EventsY#" "SpaceGlass\Events"][!Move "#DefaultX#" "#TasksY#" "SpaceGlass\Tasks"]
ContextTitle="Open SpaceGlass Settings"
ContextAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab general]
ContextTitle2="Sync Google Account Now"
ContextAction2=["pythonw.exe" "#@#..\Backend\companion_ui.py" --action sync]
ContextTitle3="Reset Widget Positions (Right Stack)"
ContextAction3=[!Move "#DefaultX#" "#ClockY#" "SpaceGlass\Clock"][!Move "#DefaultX#" "#CalendarY#" "SpaceGlass\Calendar"][!Move "#DefaultX#" "#EventsY#" "SpaceGlass\Events"][!Move "#DefaultX#" "#TasksY#" "SpaceGlass\Tasks"]

[Metadata]
Name=SpaceGlass Master Controller
Author=SpaceGlass Engineering
Information=Apple-Inspired Space Glassmorphism Desktop Widget System for Windows 11. Your Universe. Your Schedule.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; Automatically ensure the local companion backend is running when master skin loads
[MeasureEnsureBackend]
Measure=Plugin
Plugin=RunCommand
Program=wscript.exe
Parameter="#@#..\Installer\start_spaceglass.vbs"
State=Hide
UpdateDivider=-1

[MeterHiddenAnchor]
Meter=Shape
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
