; ============================================================================
; SPACEGLASS — WIDGET 4: GOOGLE TASKS (Tasks/Tasks.ini)
; High-DPI / 4K Resolution Scalable Architecture
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=#DefaultX#
DefaultWindowY=#TasksY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Add New Google Task..."
ContextAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --action add-task]
ContextTitle2="Switch Google Task List..."
ContextAction2=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ContextTitle3="Toggle Completed Tasks Section"
ContextAction3=[!CommandMeasure MeasureTasksScript "ToggleCompletedSection()"]
ContextTitle4="Sync Tasks Now"
ContextAction4=[!CommandMeasure MeasureTasksWebParser "Update"]
ContextTitle5="SpaceGlass Settings..."
ContextAction5=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Google Tasks
Author=SpaceGlass Engineering
Information=High-DPI scalable two-way synchronized Google Tasks widget with status pill badge and compact unlinked card.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; --- Poll Google Tasks from Local Companion Backend ---
[MeasureTasksWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/tasks?list_id=#SelectedTaskListId#&include_completed=#ShowCompletedTasks#
RegExp=(?siU)^(.*)$
UpdateRate=#TasksRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureTasksScript "OnTasksReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureTasksScript "OnTasksError()"]

; --- Execute Task Mutations via Backend CLI Helper ---
[MeasureTaskMutationRunner]
Measure=Plugin
Plugin=RunCommand
Program=pythonw.exe
Parameter=""
State=Hide
DynamicVariables=1
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureTasksWebParser "Update"]

[MeasureTasksScript]
Measure=Script
ScriptFile=#@#Scripts\tasks.lua
UpdateDivider=30

; ============================================================================
; UNIFIED GLASSMORPHIC BACKGROUND CONTAINER (High-DPI Dual Specular Border)
; ============================================================================
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardWidth#,#TasksHeight#,#CardRadius# | Fill LinearGradient GradBg | StrokeWidth (1 * #Scale#) | Stroke Color #GlassBorderOuter#
Shape2=Rectangle (1 * #Scale#),(1 * #Scale#),(#CardWidth# - (2 * #Scale#)),(#TasksHeight# - (2 * #Scale#)),(#CardRadius# - (1 * #Scale#)) | Fill Color 0,0,0,0 | StrokeWidth (1 * #Scale#) | Stroke Color #GlassBorderInner#
GradBg=135 | #BgGradTop# ; 0.0 | #BgGradBottom# ; 1.0
AntiAlias=1
DynamicVariables=1

; ============================================================================
; HEADER ROW: ICON (24x24), LIST TITLE, STATUS PILL & SCALABLE PLUS BUTTON
; Baseline aligned along (26 * #Scale#)
; ============================================================================
[MeterTasksBadge]
Meter=Image
ImageName=#@#Icons\tasks_badge.png
X=(20 * #Scale#)
Y=(16 * #Scale#)
W=(24 * #Scale#)
H=(24 * #Scale#)
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ToolTipText="Click to switch Google Tasks list"

[MeterListTitle]
Meter=String
X=(52 * #Scale#)
Y=(18 * #Scale#)
W=(150 * #Scale#)
H=(20 * #Scale#)
ClipString=1
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
DynamicVariables=1
Text="#SelectedTaskListName#"
LeftMouseUpAction=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ToolTipText="Click to switch Google Tasks list"

; Status Pill: Muted rounded badge with rgba(255,255,255,0.07) background
[MeterTasksStatusBadgeBg]
Meter=Shape
X=(206 * #Scale#)
Y=(18 * #Scale#)
Shape=Rectangle 0,0,(76 * #Scale#),(20 * #Scale#),(10 * #Scale#) | Fill Color 255,255,255,18 | StrokeWidth (1 * #Scale#) | Stroke Color 255,255,255,25
AntiAlias=1
DynamicVariables=1
Hidden=0

[MeterTasksStatusBadge]
Meter=String
X=(244 * #Scale#)
Y=(21 * #Scale#)
FontFace=#FontPrimary#
FontSize=(9 * #Scale#)
FontColor=#TextMuted#
FontWeight=500
StringAlign=Center
AntiAlias=1
DynamicVariables=1
Text="Not linked"
Hidden=0

; Geometric Plus Icon Button (Scalable)
[MeterAddTaskBtn]
Meter=Shape
X=(292 * #Scale#)
Y=(16 * #Scale#)
Shape=Ellipse (12 * #Scale#),(12 * #Scale#),(12 * #Scale#),(12 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line (7 * #Scale#),(12 * #Scale#),(17 * #Scale#),(12 * #Scale#) | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line (12 * #Scale#),(7 * #Scale#),(12 * #Scale#),(17 * #Scale#) | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --action add-task]
MouseOverAction=[!SetOption MeterAddTaskBtn Shape "Ellipse (12 * #Scale#),(12 * #Scale#),(12 * #Scale#),(12 * #Scale#) | Fill Color 255,255,255,28 | StrokeWidth 0"][!SetOption MeterAddTaskBtn Shape2 "Line (7 * #Scale#),(12 * #Scale#),(17 * #Scale#),(12 * #Scale#) | StrokeWidth (1.8 * #Scale#) | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round"][!SetOption MeterAddTaskBtn Shape3 "Line (12 * #Scale#),(7 * #Scale#),(12 * #Scale#),(17 * #Scale#) | StrokeWidth (1.8 * #Scale#) | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round"][!UpdateMeter MeterAddTaskBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterAddTaskBtn Shape "Ellipse (12 * #Scale#),(12 * #Scale#),(12 * #Scale#),(12 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0"][!SetOption MeterAddTaskBtn Shape2 "Line (7 * #Scale#),(12 * #Scale#),(17 * #Scale#),(12 * #Scale#) | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round"][!SetOption MeterAddTaskBtn Shape3 "Line (12 * #Scale#),(7 * #Scale#),(12 * #Scale#),(17 * #Scale#) | StrokeWidth (1.5 * #Scale#) | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round"][!UpdateMeter MeterAddTaskBtn][!Redraw]
ToolTipText="Add task to Google Tasks"

; ============================================================================
; UNLINKED / EMPTY STATE: INTERACTIVE CLICKABLE PILL BUTTON
; ============================================================================
[MeterTasksEmpty]
Meter=String
X=(165 * #Scale#)
Y=(50 * #Scale#)
W=(280 * #Scale#)
FontFace=#FontPrimary#
FontSize=#FontSizeSub#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
ClipString=2
AntiAlias=1
DynamicVariables=1
Text="Connect Google Account in Settings to sync Tasks."
Hidden=0

[MeterTasksConnectBtnBg]
Meter=Shape
X=(65 * #Scale#)
Y=(78 * #Scale#)
Shape=Rectangle 0,0,(200 * #Scale#),(32 * #Scale#),(16 * #Scale#) | Fill Color #AccentOrange#,210 | StrokeWidth (1 * #Scale#) | Stroke Color 255,255,255,40
AntiAlias=1
DynamicVariables=1
Hidden=0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]
MouseOverAction=[!SetOption MeterTasksConnectBtnBg Shape "Rectangle 0,0,(200 * #Scale#),(32 * #Scale#),(16 * #Scale#) | Fill Color #AccentOrange#,255 | StrokeWidth (1 * #Scale#) | Stroke Color 255,255,255,80"][!UpdateMeter MeterTasksConnectBtnBg][!Redraw]
MouseLeaveAction=[!SetOption MeterTasksConnectBtnBg Shape "Rectangle 0,0,(200 * #Scale#),(32 * #Scale#),(16 * #Scale#) | Fill Color #AccentOrange#,210 | StrokeWidth (1 * #Scale#) | Stroke Color 255,255,255,40"][!UpdateMeter MeterTasksConnectBtnBg][!Redraw]
ToolTipText="Open Settings to link Google Account"

[MeterTasksConnectBtnText]
Meter=String
X=(165 * #Scale#)
Y=(86 * #Scale#)
FontFace=#FontPrimary#
FontSize=(10 * #Scale#)
FontColor=#TextPrimary#
FontWeight=600
StringAlign=Center
AntiAlias=1
DynamicVariables=1
Text="Connect Google Account"
Hidden=0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

