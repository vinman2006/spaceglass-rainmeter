; ============================================================================
; SPACEGLASS — WIDGET 4: GOOGLE TASKS (Tasks/Tasks.ini)
; Unified Visual Styling, Baseline Alignment & Interactive Connect Button
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=#DefaultX#
DefaultWindowY=#TasksY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Add New Google Task..."
ContextAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --action add-task]
ContextTitle2="Switch Google Task List..."
ContextAction2=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ContextTitle3="Toggle Completed Tasks Section"
ContextAction3=[!CommandMeasure MeasureTasksScript "ToggleCompletedSection()"]
ContextTitle4="Sync Tasks Now"
ContextAction4=[!CommandMeasure MeasureTasksWebParser "Update"]
ContextTitle5="SpaceGlass Settings..."
ContextAction5=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Google Tasks
Author=SpaceGlass Engineering
Information=Two-way synchronized Google Tasks widget with status pill badge and compact unlinked card.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; --- Poll Google Tasks from Local Companion Backend ---
[MeasureTasksWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/tasks?list_id=#SelectedTaskListId#&include_completed=#ShowCompletedTasks#
RegExp=(?siU)^(.*)$
UpdateRate=#TasksRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureTasksScript "OnTasksReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureTasksScript "OnTasksError()"]

; --- Execute Task Mutations via Backend CLI Helper ---
[MeasureTaskMutationRunner]
Measure=Plugin
Plugin=RunCommand
Program=pythonw.exe
Parameter=""
State=Hide
DynamicVariables=1
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureTasksWebParser "Update"]

[MeasureTasksScript]
Measure=Script
ScriptFile=#@#Scripts\tasks.lua
UpdateDivider=30

; ============================================================================
; UNIFIED GLASSMORPHIC BACKGROUND CONTAINER
; ============================================================================
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardWidth#,#TasksHeight#,#CardRadius# | Fill LinearGradient GradBg | StrokeWidth 1 | Stroke Color #CardBorder#
GradBg=135 | #BgGradTop# ; 0.0 | #BgGradBottom# ; 1.0
AntiAlias=1
DynamicVariables=1

; ============================================================================
; HEADER ROW: ICON (24x24), LIST TITLE, STATUS PILL & GEOMETRIC PLUS BUTTON
; Baseline aligned along Y=26
; ============================================================================
[MeterTasksBadge]
Meter=Image
ImageName=#@#Icons\tasks_badge.png
X=20
Y=16
W=24
H=24
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ToolTipText="Click to switch Google Tasks list"

[MeterListTitle]
Meter=String
X=52
Y=18
W=150
H=20
ClipString=1
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
Text="#SelectedTaskListName#"
LeftMouseUpAction=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ToolTipText="Click to switch Google Tasks list"

; Status Pill: Muted rounded badge with rgba(255,255,255,0.07) background
[MeterTasksStatusBadgeBg]
Meter=Shape
X=206
Y=18
Shape=Rectangle 0,0,76,20,10 | Fill Color 255,255,255,18 | StrokeWidth 1 | Stroke Color 255,255,255,25
AntiAlias=1
DynamicVariables=1
Hidden=0

[MeterTasksStatusBadge]
Meter=String
X=244
Y=21
FontFace=#FontPrimary#
FontSize=9
FontColor=#TextMuted#
FontWeight=500
StringAlign=Center
AntiAlias=1
Text="Not linked"
DynamicVariables=1
Hidden=0

; Geometric Plus Icon Button
[MeterAddTaskBtn]
Meter=Shape
X=292
Y=16
Shape=Ellipse 12,12,12,12 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line 7,12,17,12 | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line 12,7,12,17 | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --action add-task]
MouseOverAction=[!SetOption MeterAddTaskBtn Shape "Ellipse 12,12,12,12 | Fill Color 255,255,255,28 | StrokeWidth 0"][!SetOption MeterAddTaskBtn Shape2 "Line 7,12,17,12 | StrokeWidth 1.8 | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round"][!SetOption MeterAddTaskBtn Shape3 "Line 12,7,12,17 | StrokeWidth 1.8 | Stroke Color #TextPrimary# | StrokeStartCap Round | StrokeEndCap Round"][!UpdateMeter MeterAddTaskBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterAddTaskBtn Shape "Ellipse 12,12,12,12 | Fill Color 0,0,0,1 | StrokeWidth 0"][!SetOption MeterAddTaskBtn Shape2 "Line 7,12,17,12 | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round"][!SetOption MeterAddTaskBtn Shape3 "Line 12,7,12,17 | StrokeWidth 1.5 | Stroke Color #TextMuted# | StrokeStartCap Round | StrokeEndCap Round"][!UpdateMeter MeterAddTaskBtn][!Redraw]
ToolTipText="Add task to Google Tasks"

; ============================================================================
; UNLINKED / EMPTY STATE: INTERACTIVE CLICKABLE PILL BUTTON
; ============================================================================
[MeterTasksEmpty]
Meter=String
X=165
Y=50
W=280
FontFace=#FontPrimary#
FontSize=#FontSizeSub#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
ClipString=2
AntiAlias=1
Text="Connect Google Account in Settings to sync Tasks."
Hidden=0
DynamicVariables=1

[MeterTasksConnectBtnBg]
Meter=Shape
X=65
Y=78
Shape=Rectangle 0,0,200,32,16 | Fill Color #AccentOrange#,210 | StrokeWidth 1 | Stroke Color 255,255,255,40
AntiAlias=1
DynamicVariables=1
Hidden=0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]
MouseOverAction=[!SetOption MeterTasksConnectBtnBg Shape "Rectangle 0,0,200,32,16 | Fill Color #AccentOrange#,255 | StrokeWidth 1 | Stroke Color 255,255,255,80"][!UpdateMeter MeterTasksConnectBtnBg][!Redraw]
MouseLeaveAction=[!SetOption MeterTasksConnectBtnBg Shape "Rectangle 0,0,200,32,16 | Fill Color #AccentOrange#,210 | StrokeWidth 1 | Stroke Color 255,255,255,40"][!UpdateMeter MeterTasksConnectBtnBg][!Redraw]
ToolTipText="Open Settings to link Google Account"

[MeterTasksConnectBtnText]
Meter=String
X=165
Y=86
FontFace=#FontPrimary#
FontSize=10
FontColor=#TextPrimary#
FontWeight=600
StringAlign=Center
AntiAlias=1
Text="Connect Google Account"
DynamicVariables=1
Hidden=0
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

