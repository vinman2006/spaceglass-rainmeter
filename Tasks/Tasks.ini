; ============================================================================
; SPACEGLASS — WIDGET 4: GOOGLE TASKS (Tasks/Tasks.ini)
; Visual layout matches reference screenshot:
;   Header: Blue circular checkmark icon + "My Tasks" (clickable list switcher)
;           + "+" button (opens quick add-task dialog)
;   Tasks:  4 interactive task rows:
;           - Unchecked circle ring or Checked solid orange circle (#FF7A18)
;           - Task title (strikethrough + muted when completed)
;           - Optional due/overdue badge & hover delete action
; ============================================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowW=320
WindowH=196
DefaultWindowX=#DefaultX#
DefaultWindowY=#TasksY#
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle="Add New Google Task..."
ContextAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --action add-task]
ContextTitle2="Switch Google Task List..."
ContextAction2=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ContextTitle3="Toggle Completed Tasks Section"
ContextAction3=[!CommandMeasure MeasureTasksScript "ToggleCompletedSection()"]
ContextTitle4="Sync Tasks Now"
ContextAction4=[!CommandMeasure MeasureTasksWebParser "Update"]
ContextTitle5="SpaceGlass Settings..."
ContextAction5=["pythonw.exe" "#@#..\Backend\companion_ui.py" --tab google]

[Metadata]
Name=SpaceGlass — Google Tasks
Author=SpaceGlass Engineering
Information=Two-way synchronized Google Tasks widget supporting completion toggle, reopening, task creation, deletion, and list switching.
Version=1.0.0
License=MIT

@IncludeVars=#@#Variables.inc
@IncludeTheme=#@#Theme.inc

; [MeasureFrostedGlass]  Disabled (plugin not installed)
; Measure=Plugin
; Plugin=FrostedGlass
; Type=#BlurType#
; Border=#BlurBorder#
; Corner=Round
; Backdrop=Dark

; --- Poll Google Tasks from Local Companion Backend ---
[MeasureTasksWebParser]
Measure=WebParser
URL=#BackendBaseUrl#/api/tasks?list_id=#SelectedTaskListId#&include_completed=#ShowCompletedTasks#
RegExp=(?siU)^(.*)$
UpdateRate=#TasksRefreshSeconds#
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureTasksScript "OnTasksReceived()"]
OnConnectErrorAction=[!CommandMeasure MeasureTasksScript "OnTasksError()"]

; --- Execute Task Mutations (Complete/Reopen/Delete/Switch List) via Backend CLI Helper ---
[MeasureTaskMutationRunner]
Measure=Plugin
Plugin=RunCommand
Program=pythonw.exe
Parameter=""
State=Hide
DynamicVariables=1
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureTasksWebParser "Update"]

[MeasureTasksScript]
Measure=Script
ScriptFile=#@#Scripts\tasks.lua
UpdateDivider=30

; ============================================================================
; GLASSMORPHISM PANEL & HEADER ROW
; ============================================================================
[MeterGlassPanel]
Meter=Shape
X=0
Y=0
Shape=Rectangle 1,1,318,194,#GlassCornerRadius# | Fill Color #GlassSurface# | StrokeWidth 0
Shape2=Rectangle 1,1,318,194,#GlassCornerRadius# | Fill LinearGradient GradFill | StrokeWidth #GlassBorderWidth# | Stroke LinearGradient GradBorder
Shape3=Rectangle 2,2,316,192,(#GlassCornerRadius#-1) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #GlassBorderInner#
GradFill=135 | #GlassGradientTop# ; 0.0 | #GlassAmbientWarm# ; 0.45 | #GlassGradientBottom# ; 1.0
GradBorder=145 | #GlassHighlightTop# ; 0.0 | #GlassBorderOuter# ; 0.5 | 255,255,255,25 ; 1.0

[MeterGlassReflection]
Meter=Image
ImageName=#@#Images\glass_reflection.png
X=1
Y=1
W=318
H=194
ImageAlpha=170

[MeterTasksBadge]
Meter=Image
ImageName=#@#Icons\tasks_badge.png
X=20
Y=15
W=24
H=24
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ToolTipText="Click to switch Google Tasks list"

[MeterListTitle]
Meter=String
X=52
Y=18
W=195
H=20
ClipString=1
FontFace=#FontPrimary#
FontSize=#FontSizeHeader#
FontColor=#TextPrimary#
FontWeight=#FontWeightSemibold#
AntiAlias=1
Text="#SelectedTaskListName#"
LeftMouseUpAction=[!CommandMeasure MeasureTasksScript "CycleTaskList()"]
ToolTipText="Click to switch Google Tasks list"

[MeterTasksStatusBadge]
Meter=String
X=262
Y=20
FontFace=#FontPrimary#
FontSize=8
FontColor=#TextDimmed#
StringAlign=Right
AntiAlias=1
Text=""
DynamicVariables=1

[MeterAddTaskBtn]
Meter=String
X=292
Y=13
W=24
H=24
FontFace=#FontPrimary#
FontSize=15
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
AntiAlias=1
Text="+"
LeftMouseUpAction=["pythonw.exe" "#@#..\Backend\companion_ui.py" --action add-task]
MouseOverAction=[!SetOption MeterAddTaskBtn FontColor "#TextPrimary#"][!UpdateMeter MeterAddTaskBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterAddTaskBtn FontColor "#TextMuted#"][!UpdateMeter MeterAddTaskBtn][!Redraw]
ToolTipText="Add a new task to Google Tasks"

; ============================================================================
; EMPTY / ERROR MESSAGE
; ============================================================================
[MeterTasksEmpty]
Meter=String
X=160
Y=98
W=276
FontFace=#FontPrimary#
FontSize=#FontSizeBody#
FontColor=#TextMuted#
FontWeight=#FontWeightRegular#
StringAlign=Center
ClipString=2
AntiAlias=1
Text="All tasks completed!"
Hidden=1

